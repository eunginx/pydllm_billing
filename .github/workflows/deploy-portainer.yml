name: Deploy to Portainer (GitOps)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

env:
  # Push to GitHub Container Registry (ghcr.io). Portainer is configured
  # with a GitHub PAT to pull these images, so no Docker Hub is used.
  REGISTRY: ghcr.io
  IMAGE_NAME: eunginx/pydllm_billing
  FRAPPE_BRANCH: version-16
  PORTAINER_WEBHOOK_URL: https://portainer.pn.sorsiri.in/api/stacks/webhooks/0a6007d0-5b82-4d98-9084-84b1dfc0af88

jobs:
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # The upstream layered Containerfile lives in frappe/frappe_docker and
      # pulls pre-built base images (frappe/build, frappe/base) from Docker
      # Hub as its foundation, then pre-installs our apps at build time.
      - name: Checkout frappe_docker
        uses: actions/checkout@v5
        with:
          repository: frappe/frappe_docker
          path: builds

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      # Build a single production image that pre-installs frappe + erpnext +
      # payments + hrms at build time (via apps.json secret). This image
      # serves backend (gunicorn), frontend (nginx), websocket, queue and
      # scheduler — no runtime `bench init` is needed.
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: builds
          file: builds/images/layered/Containerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            FRAPPE_BRANCH=${{ env.FRAPPE_BRANCH }}
          secret-files: |
            apps_json=${{ github.workspace }}/.github/helper/apps.json
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-portainer:
    name: Deploy Stack to Portainer
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Trigger Portainer webhook
        run: |
          echo "Triggering Portainer webhook to redeploy stack..."
          curl -X POST "${{ env.PORTAINER_WEBHOOK_URL }}"
          echo "Webhook triggered successfully"

      - name: Verify deployment
        run: |
          echo "Waiting for deployment to complete..."
          sleep 45
          curl -f https://ledger.pn.sorsiri.in/api/method/healthcheck || exit 1