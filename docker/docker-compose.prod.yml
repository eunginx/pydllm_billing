version: "3.8"

services:
  backend:
    image: frappe/bench:latest
    command: bash /workspace/init.sh
    working_dir: /home/frappe
    environment:
      - SHELL=/bin/bash
      - FRAPPE_SITE_NAME_HEADER=ledger.pn.sorsiri.in
    volumes:
      - .:/workspace
      - frappe-sites:/home/frappe/frappe-bench/sites
      - frappe-logs:/home/frappe/frappe-bench/logs
    networks:
      - frappe-network
    restart: unless-stopped
    depends_on:
      - mariadb
      - redis
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/method/healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  mariadb:
    image: mariadb:10.8
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
      - --skip-innodb-read-only-compressed
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123}
    volumes:
      - mariadb-data:/var/lib/mysql
    networks:
      - frappe-network
    restart: unless-stopped

  redis:
    image: redis:alpine
    networks:
      - frappe-network
    restart: unless-stopped

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    # This stack sits behind an external reverse proxy (e.g. jc21/nginx-proxy-manager).
    # Host port is configurable via NGINX_HOST_PORT (default 8484).
    # TLS termination is handled by the external proxy.
    ports:
      - "${NGINX_HOST_PORT:-8484}:80"
    networks:
      - frappe-network
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mariadb-data:
  frappe-sites:
  frappe-logs:

networks:
  frappe-network:
